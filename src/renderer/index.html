<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>DeskMudgin</title>
  <!--
    The window is transparent, so everything here must be too. `background:
    transparent` on both html and body is not redundant — either one left at
    the default paints a white plate over the whole virtual desktop.

    `pointer-events: none` on the body is belt and braces: the window is
    click-through at the OS level (setIgnoreMouseEvents), and the canvas turns
    pointer events back on for itself so the renderer can still see the cursor.
  -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
      cursor: default;
    }
    #stage {
      display: block;
      width: 100%;
      height: 100%;
      pointer-events: auto;
    }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>
  <script type="module" src="./main.ts"></script>
</body>
</html>
